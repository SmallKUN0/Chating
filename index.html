        versionSelectBtn.textContent = versionData[currentVersionIndex].name;

        function loadPluginState() {
            try { const saved = localStorage.getItem('kk_plugins'); if (saved) pluginState = JSON.parse(saved); }
            catch (e) { pluginState = {}; }
        }
        function savePluginState() {
            try { localStorage.setItem('kk_plugins', JSON.stringify(pluginState)); }
            catch (e) { console.warn('插件状态保存失败'); }
        }
        function togglePlugin(id) { pluginState[id] = !pluginState[id]; savePluginState(); renderPluginPicker(); }
        function applyPlugins() {
            document.body.classList.toggle('plugin-landscape', !!pluginState['landscape']);
            document.body.classList.toggle('plugin-fullscreen', !!pluginState['fullscreen']);
        }
        function clearPlugins() { document.body.classList.remove('plugin-landscape', 'plugin-fullscreen'); }
        loadPluginState();

        function checkUpdateNotice() {
            try { const notified = localStorage.getItem('2.0更新提示已通知'); if (!notified) updateModal.style.display = 'flex'; }

        function clearAllCache(e) {

            catch (err) { alert('清理缓存失败: ' + err.message); }

        function openVersionPicker() {
            pickerList.innerHTML = '';
            versionData.forEach((v, idx) => {
                const item = document.createElement('div');
                item.className = 'picker-item';
                item.textContent = v.name;
                if (idx === currentVersionIndex) item.classList.add('selected');
                let startTime = 0, startY = 0, hasMoved = false;
                function onPointerDown(ev) { const pos = getClientPos(ev); startTime = Date.now(); startY = pos.y; hasMoved = false; }
                function onPointerMove(ev) { const pos = getClientPos(ev); if (Math.abs(pos.y - startY) > 10) hasMoved = true; }
                function onPointerUp(ev) { const dt = Date.now() - startTime; if (!hasMoved && dt < 200) { ev.preventDefault && ev.preventDefault(); ev.stopPropagation && ev.stopPropagation(); selectVersion(idx); } }
                item.addEventListener('mousedown', onPointerDown);
                item.addEventListener('mousemove', onPointerMove);
                item.addEventListener('mouseup', onPointerUp);
                item.addEventListener('touchstart', onPointerDown, { passive: true });
                item.addEventListener('touchmove', onPointerMove, { passive: true });
                item.addEventListener('touchend', (ev) => { ev.preventDefault(); onPointerUp(ev); }, { passive: false });
                pickerList.appendChild(item);
            });
            versionPicker.style.display = 'flex';
        }
        function selectVersion(index) { currentVersionIndex = index; versionSelectBtn.textContent = versionData[index].name; versionPicker.style.display = 'none'; }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); });
        }
        async function loadResources() {
            if (isLoadingResources) return;
            isLoadingResources = true;
            resourceAbortController = new AbortController();
            const signal = resourceAbortController.signal;
            resourceLoader.style.display = 'flex';
            progressBarFill.style.width = '0%';
            loaderCurrentFile.textContent = '';
            loaderStatus.textContent = '';
            const total = textureList.length;
            const cachedData = {};
            let successCount = 0, failCount = 0;
            for (let i = 0; i < total; i++) {
                if (signal.aborted) { loaderStatus.textContent = '已取消'; isLoadingResources = false; return; }
                const tex = textureList[i];
                loaderCurrentFile.textContent = '正在缓存：' + tex.display;
                progressBarFill.style.width = Math.round(((i) / total) * 100) + '%';
                try {
                    const url = TEXTURE_BASE_URL + tex.file;
                    const response = await fetch(url, { signal });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const blob = await response.blob();
                    const base64 = await blobToBase64(blob);
                    cachedData[tex.file] = base64;
                    successCount++;
                } catch (err) {
                    if (signal.aborted) { loaderStatus.textContent = '已取消'; isLoadingResources = false; return; }
                    failCount++;
                    console.warn('加载失败:', tex.file, err.message);
                }
            }
            progressBarFill.style.width = '100%';
            loaderCurrentFile.textContent = '';
            try { localStorage.setItem('kk_textures', JSON.stringify(cachedData)); loaderStatus.textContent = '加载完成！成功 ' + successCount + ' 个' + (failCount > 0 ? '，失败 ' + failCount + ' 个' : ''); }
            catch (err) { loaderStatus.textContent = '缓存保存失败: ' + err.message; }
            setTimeout(() => { resourceLoader.style.display = 'none'; isLoadingResources = false; resourceAbortController = null; }, 1500);
        }
        function cancelLoadResources() {
            if (resourceAbortController) resourceAbortController.abort();
            resourceLoader.style.display = 'none';
            isLoadingResources = false;
            resourceAbortController = null;
        }
        loadResourceBtn.addEventListener('click', loadResources);
        loadResourceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); loadResources(); }, { passive: false });
        loaderCancelBtn.addEventListener('click', cancelLoadResources);
        loaderCancelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); cancelLoadResources(); }, { passive: false });

        function renderPluginPicker() {
            pluginPickerList.innerHTML = '';
            pluginData.forEach((p) => {
                const item = document.createElement('div');
                item.className = 'plugin-picker-item';
                const checkbox = document.createElement('div');
                checkbox.className = 'plugin-checkbox' + (pluginState[p.id] ? ' checked' : '');
                const info = document.createElement('div');
                info.className = 'plugin-info';
                const name = document.createElement('div');
                name.className = 'plugin-name';
                name.textContent = p.name;
                const desc = document.createElement('div');
                desc.className = 'plugin-desc';
                desc.textContent = p.desc;
                info.appendChild(name);
                info.appendChild(desc);
                item.appendChild(checkbox);
                item.appendChild(info);
                item.addEventListener('click', () => togglePlugin(p.id));
                item.addEventListener('touchstart', (e) => { e.preventDefault(); togglePlugin(p.id); }, { passive: false });
                pluginPickerList.appendChild(item);
            });
        }
        function openPluginPicker() { renderPluginPicker(); pluginPicker.style.display = 'flex'; }
        function closePluginPicker() { pluginPicker.style.display = 'none'; }
        pluginBtn.addEventListener('click', openPluginPicker);
        pluginBtn.addEventListener('touchstart', (e) => { e.preventDefault(); openPluginPicker(); }, { passive: false });
        pluginPickerBackBtn.addEventListener('click', closePluginPicker);
        pluginPickerBackBtn.addEventListener('touchstart', (e) => { e.preventDefault(); closePluginPicker(); }, { passive: false });

        let gsOffsetX = 0;
        let gsSeed = Math.random() * 10000;
        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function grad(hash, x) { return (hash & 1) === 0 ? x : -x; }
        function noise1D(x) {
            const X = Math.floor(x) & 255;
            const xf = x - Math.floor(x);
            const u = fade(xf);
            const p = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
            const n0 = grad(p[X], xf);
            const n1 = grad(p[(X + 1) & 255], xf - 1);
            return lerp(n0, n1, u);
        }
        function fbm(x) {
            let value = 0, amplitude = 0.5, frequency = 1;
            for (let i = 0; i < 4; i++) { value += amplitude * noise1D(x * frequency + gsSeed); amplitude *= 0.5; frequency *= 2; }
            return value;
        }
        function getTerrainHeight(x) { const n = fbm(x * 0.05); return Math.floor((n + 0.5) * 12) + 4; }
        function drawTerrain() {
            const ctx = gsCanvas.getContext('2d');
            const w = gsCanvas.width, h = gsCanvas.height;
            const blockSize = 16;
            const cols = Math.ceil(w / blockSize), rows = Math.ceil(h / blockSize);
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, w, h);
            for (let c = 0; c < 5; c++) {
                const cx = ((c * 137 + gsSeed * 3) % (w + 100)) - 50 + (gsOffsetX * 0.3) % w;
                const cy = 30 + (c * 23) % 60;
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.arc(cx + 18, cy - 5, 16, 0, Math.PI * 2);
                ctx.arc(cx + 35, cy, 18, 0, Math.PI * 2);
                ctx.fill();
            }
            for (let col = 0; col < cols; col++) {
                const worldX = col + Math.floor(gsOffsetX);
                const terrainH = getTerrainHeight(worldX);
                const surfaceY = h - terrainH * blockSize;
                for (let row = 0; row < rows; row++) {
                    const by = row * blockSize;
                    if (by < surfaceY) continue;
                    const depth = Math.floor((by - surfaceY) / blockSize);
                    let color, borderColor;
                    if (depth === 0) {
                        const topNoise = noise1D(worldX * 0.3 + gsSeed);
                        if (topNoise > 0.3) { color = '#5D8C3A'; borderColor = '#4A7030'; }
                        else if (topNoise > -0.3) { color = '#6B9E42'; borderColor = '#5A8538'; }
                        else { color = '#7AAF4C'; borderColor = '#6B9E42'; }
                    } else if (depth <= 2) { color = '#8B6914'; borderColor = '#6B5010'; }
                    else if (depth <= 5) {
                        const stoneVar = noise1D(worldX * 0.5 + depth + gsSeed);
                        if (stoneVar > 0.2) { color = '#7A7A7A'; borderColor = '#666666'; }
                        else { color = '#888888'; borderColor = '#757575'; }
                    } else if (depth <= 7) { color = '#666666'; borderColor = '#555555'; }
                    else { color = '#333333'; borderColor = '#222222'; }
                    ctx.fillStyle = color;
                    ctx.fillRect(col * blockSize, by, blockSize, blockSize);
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(col * blockSize + 0.5, by + 0.5, blockSize - 1, blockSize - 1);
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.fillRect(col * blockSize, by, blockSize, 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.fillRect(col * blockSize, by + blockSize - 2, blockSize, 2);
                }
                const treeNoise = noise1D(worldX * 0.7 + gsSeed + 1000);
                if (treeNoise > 0.75 && terrainH > 3) drawTree(ctx, col * blockSize, surfaceY - blockSize, blockSize);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Three GS 地形测试 | 偏移: ' + gsOffsetX, 10, 20);
            ctx.font = '12px sans-serif';
            ctx.fillText('使用噪声生成类似我的世界地形', 10, 38);
        }
        function drawTree(ctx, x, y, size) {
            ctx.fillStyle = '#6B4226';
            ctx.fillRect(x + size * 0.375, y - size * 3, size * 0.25, size * 3);
            ctx.fillStyle = '#3D7A28';
            const leafCenterX = x + size * 0.5, leafCenterY = y - size * 3.5;
            for (let ly = 0; ly < 3; ly++) {
                const layerWidth = ly === 1 ? 2.5 : 1.8;
                const layerY = leafCenterY + ly * size * 0.6;
                ctx.fillRect(leafCenterX - size * layerWidth * 0.5, layerY, size * layerWidth, size * 0.8);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(leafCenterX - size * 0.5, leafCenterY, size * 0.3, size * 0.3);
        }
        function openGSTest() {
            gsTestScreen.style.display = 'flex';
            gsSeed = Math.random() * 10000;
            gsOffsetX = 0;
            const dpr = window.devicePixelRatio || 1;
            gsCanvas.width = 800 * dpr;
            gsCanvas.height = 480 * dpr;
            const ctx = gsCanvas.getContext('2d');
            ctx.scale(dpr, dpr);
            gsCanvas.style.width = '800px';
            gsCanvas.style.height = '480px';
            drawTerrain();
        }
        function closeGSTest() { gsTestScreen.style.display = 'none'; }
        gsTestBtn.addEventListener('click', openGSTest);
        gsTestBtn.addEventListener('touchstart', (e) => { e.preventDefault(); openGSTest(); }, { passive: false });
        gsBackBtn.addEventListener('click', closeGSTest);
        gsBackBtn.addEventListener('touchstart', (e) => { e.preventDefault(); closeGSTest(); }, { passive: false });
        gsRegenBtn.addEventListener('click', () => { gsSeed = Math.random() * 10000; drawTerrain(); });
        gsRegenBtn.addEventListener('touchstart', (e) => { e.preventDefault(); gsSeed = Math.random() * 10000; drawTerrain(); }, { passive: false });
        gsLeftBtn.addEventListener('click', () => { gsOffsetX -= 3; drawTerrain(); });
        gsLeftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); gsOffsetX -= 3; drawTerrain(); }, { passive: false });
        gsRightBtn.addEventListener('click', () => { gsOffsetX += 3; drawTerrain(); });
        gsRightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); gsOffsetX += 3; drawTerrain(); }, { passive: false });

        function resetToMain() {
            gameFrame.src = '';
            gameContainer.style.display = 'none';
            floatBall.style.display = 'none';
            loadingScreen.style.display = 'none';
            loadingScreen.classList.remove('show');
            mainScreen.style.display = 'flex';
            isLaunching = false;
            clearPlugins();
        }

        function handleLaunch(e) {
            if (isLaunching) return;
            isLaunching = true;
            if (e && e.type === 'touchstart') e.preventDefault();
            mainScreen.style.display = 'none';
            loadingScreen.style.display = 'flex';
            void loadingScreen.offsetWidth;
            loadingScreen.classList.add('show');
            const version = versionData[currentVersionIndex];
            setTimeout(() => {
                loadingText.textContent = '检查依赖……（随后3s后开始正转）';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    loadingScreen.classList.remove('show');
                    if (version && version.file) {
                        gameFrame.src = version.file;
                        gameContainer.style.display = 'block';
                        floatBall.style.display = 'flex';
                        applyPlugins();
                    }
                }, 3000);
            }, 50);
        }
        launchBtn.addEventListener('click', handleLaunch);
        launchBtn.addEventListener('mousedown', handleLaunch);
        launchBtn.addEventListener('touchstart', handleLaunch, { passive: false });

        let dragState = { isDragging: false, startX: 0, startY: 0, ballLeft: 0, ballTop: 0, startTime: 0, hasMoved: false, longPressTimer: null };
        const LONG_PRESS_TIME = 800;
        const MOVE_THRESHOLD = 10;
        function getClientPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }
        function onBallDown(e) {
            e.preventDefault(); e.stopPropagation();
            const pos = getClientPos(e);
            const rect = floatBall.getBoundingClientRect();
            dragState.isDragging = true;
            dragState.hasMoved = false;
            dragState.startX = pos.x;
            dragState.startY = pos.y;
            dragState.ballLeft = rect.left;
            dragState.ballTop = rect.top;
            dragState.startTime = Date.now();
            floatBall.classList.add('dragging');
            dragState.longPressTimer = setTimeout(() => {
                if (dragState.isDragging && !dragState.hasMoved) {
                    dragState.isDragging = false;
                    floatBall.classList.remove('dragging');
                    resetToMain();
                }
            }, LONG_PRESS_TIME);
        }
        function onBallMove(e) {
            if (!dragState.isDragging) return;
            const pos = getClientPos(e);
            const dx = pos.x - dragState.startX;
            const dy = pos.y - dragState.startY;
            if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
                dragState.hasMoved = true;
                if (dragState.longPressTimer) { clearTimeout(dragState.longPressTimer); dragState.longPressTimer = null; }
            }
            floatBall.style.left = (dragState.ballLeft + dx) + 'px';
            floatBall.style.top = (dragState.ballTop + dy) + 'px';
            floatBall.style.transform = 'none';
        }
        function onBallUp(e) {
            if (!dragState.isDragging) return;
            if (dragState.longPressTimer) { clearTimeout(dragState.longPressTimer); dragState.longPressTimer = null; }
            const wasDragging = dragState.isDragging;
            dragState.isDragging = false;
            floatBall.classList.remove('dragging');
            if (wasDragging && !dragState.hasMoved && (Date.now() - dragState.startTime < LONG_PRESS_TIME)) confirmModal.style.display = 'flex';
        }
        floatBall.addEventListener('mousedown', onBallDown);
        floatBall.addEventListener('touchstart', onBallDown, { passive: false });
        document.addEventListener('mousemove', onBallMove);
        document.addEventListener('touchmove', onBallMove, { passive: false });
        document.addEventListener('mouseup', onBallUp);
        document.addEventListener('touchend', onBallUp);

        function onYes(e) { if (e && e.type === 'touchstart') e.preventDefault(); confirmModal.style.display = 'none'; resetToMain(); }
        function onNo(e) { if (e && e.type === 'touchstart') e.preventDefault(); confirmModal.style.display = 'none'; }
        btnYes.addEventListener('click', onYes);
        btnYes.addEventListener('mousedown', onYes);
        btnYes.addEventListener('touchstart', onYes, { passive: false });
        btnNo.addEventListener('click', onNo);
        btnNo.addEventListener('mousedown', onNo);
        btnNo.addEventListener('touchstart', onNo, { passive: false });
    </script>
