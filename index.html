<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线聊天室</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh; display: flex; justify-content: center; align-items: center;
    }
    .container {
      width: 900px; max-width: 95vw; height: 85vh;
      background: white; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex; overflow: hidden;
    }
    .sidebar {
      width: 260px; background: #f8f9fa; border-right: 1px solid #e9ecef;
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 20px; background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .sidebar-header h2 { font-size: 18px; margin-bottom: 5px; }
    .online-count { font-size: 13px; opacity: 0.9; }
    .user-list {
      flex: 1; overflow-y: auto; padding: 10px;
    }
    .user-item {
      display: flex; align-items: center; padding: 10px;
      border-radius: 10px; margin-bottom: 5px; cursor: pointer;
      transition: background 0.2s;
    }
    .user-item:hover { background: #e9ecef; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      margin-right: 12px; background: #ddd;
    }
    .user-name { font-size: 14px; color: #333; }
    .user-status {
      width: 8px; height: 8px; background: #28a745;
      border-radius: 50%; margin-left: auto;
      box-shadow: 0 0 0 2px white;
    }
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
    }
    .chat-header {
      padding: 15px 20px; border-bottom: 1px solid #e9ecef;
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header h3 { color: #333; font-size: 16px; }
    .messages {
      flex: 1; overflow-y: auto; padding: 20px;
      background: #fafbfc;
    }
    .message {
      display: flex; margin-bottom: 15px; animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      margin-right: 12px; flex-shrink: 0;
    }
    .message-content { max-width: 70%; }
    .message-header {
      display: flex; align-items: center; margin-bottom: 4px;
    }
    .message-name {
      font-size: 13px; font-weight: 600; color: #667eea;
      margin-right: 8px;
    }
    .message-time {
      font-size: 11px; color: #adb5bd;
    }
    .message-bubble {
      background: white; padding: 10px 14px;
      border-radius: 12px; border: 1px solid #e9ecef;
      font-size: 14px; color: #333; line-height: 1.5;
      word-break: break-all;
    }
    .message.own {
      flex-direction: row-reverse;
    }
    .message.own .message-avatar { margin-right: 0; margin-left: 12px; }
    .message.own .message-content { text-align: right; }
    .message.own .message-header { justify-content: flex-end; }
    .message.own .message-bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border: none;
    }
    .system-msg {
      text-align: center; color: #adb5bd;
      font-size: 12px; margin: 10px 0;
    }
    .typing-indicator {
      padding: 0 20px; height: 20px;
      font-size: 12px; color: #adb5bd;
      font-style: italic;
    }
    .input-area {
      padding: 15px 20px; border-top: 1px solid #e9ecef;
      display: flex; align-items: center; gap: 10px;
      background: white;
    }
    .input-area input {
      flex: 1; padding: 12px 16px; border: 1px solid #e9ecef;
      border-radius: 25px; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #667eea; }
    .input-area button {
      padding: 12px 24px; border: none; border-radius: 25px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; font-size: 14px; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .input-area button:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 100;
    }
    .login-box {
      background: white; padding: 40px; border-radius: 20px;
      width: 360px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-box h1 {
      font-size: 24px; margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-box p { color: #adb5bd; margin-bottom: 25px; font-size: 14px; }
    .login-box input {
      width: 100%; padding: 14px; border: 1px solid #e9ecef;
      border-radius: 12px; font-size: 15px; margin-bottom: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: #667eea; }
    .login-box button {
      width: 100%; padding: 14px; border: none;
      border-radius: 12px; font-size: 15px; color: white;
      background: linear-gradient(135deg, #667eea, #764ba2);
      cursor: pointer; font-weight: 600;
      transition: transform 0.2s;
    }
    .login-box button:hover { transform: scale(1.02); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 3px; }
  </style>
</head>
<body>
  <!-- 登录弹窗 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h1>🚀 在线聊天室</h1>
      <p>输入昵称，开始和真人实时聊天</p>
      <input type="text" id="usernameInput" placeholder="请输入你的昵称" maxlength="12" autofocus>
      <button onclick="joinChat()">进入聊天室</button>
    </div>
  </div>

  <div class="container" id="chatContainer" style="display:none;">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>👥 在线用户</h2>
        <div class="online-count" id="onlineCount">0 人在线</div>
      </div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="chat-area">
      <div class="chat-header">
        <h3>💬 公共聊天室</h3>
        <span style="font-size:12px;color:#adb5bd;">实时连接中 🟢</span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typingIndicator"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息按回车发送..." maxlength="200">
        <button onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let typingTimer = null;

    function joinChat() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) {
        alert('请输入昵称！');
        return;
      }
      currentUser = name;
      socket.emit('join', name);
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('chatContainer').style.display = 'flex';
      document.getElementById('messageInput').focus();
    }

    document.getElementById('usernameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chatMessage', { text });
      input.value = '';
      socket.emit('typing', false);
    }

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      } else {
        socket.emit('typing', true);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => socket.emit('typing', false), 2000);
      }
    });

    // 接收消息
    socket.on('message', (data) => {
      const isOwn = data.user.name === currentUser;
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : ''}`;
      div.innerHTML = `
        <img class="message-avatar" src="${data.user.avatar}" alt="">
        <div class="message-content">
          <div class="message-header">
            <span class="message-name">${data.user.name}</span>
            <span class="message-time">${data.time}</span>
          </div>
          <div class="message-bubble">${escapeHtml(data.text)}</div>
        </div>
      `;
      const messages = document.getElementById('messages');
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });

    // 系统通知
    socket.on('userJoined', (data) => {
      showSystemMsg(`🎉 ${data.user.name} 加入了聊天室`);
      updateUserList(data.users, data.count);
    });

    socket.on('userLeft', (data) => {
      showSystemMsg(`👋 ${data.user.name} 离开了聊天室`);
      updateUserList(data.users, data.count);
    });

    function showSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      const messages = document.getElementById('messages');
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function updateUserList(users, count) {
      document.getElementById('onlineCount').textContent = `${count} 人在线`;
      const list = document.getElementById('userList');
      list.innerHTML = users.map(u => `
        <div class="user-item">
          <img class="user-avatar" src="${u.avatar}" alt="">
          <span class="user-name">${u.name}</span>
          <span class="user-status"></span>
        </div>
      `).join('');
    }

    // 正在输入提示
    socket.on('typing', (data) => {
      const indicator = document.getElementById('typingIndicator');
      if (data.isTyping) {
        indicator.textContent = `✏️ ${data.user.name} 正在输入...`;
      } else {
        indicator.textContent = '';
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
