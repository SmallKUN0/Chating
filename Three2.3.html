        function addEditButtonEvents(el, btnId) {
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                editState.dragging = el;
                editState.currentBtn = btnId;
                editState.startPos = { x: touch.clientX, y: touch.clientY };

                const rect = el.getBoundingClientRect();
                editState.dragOffset = {
                    x: touch.clientX - rect.left,
                    y: touch.clientY - rect.top
                };

                editState.longPressTimer = setTimeout(() => {
                    if (editState.dragging === el) {
                        showEditMenu(el, btnId);
                    }
                }, 800);
            }, { passive: false });

            el.addEventListener('touchmove', (e) => {
                if (!editState.dragging) return;
                e.preventDefault();
                const touch = e.changedTouches[0];
                const dx = touch.clientX - editState.startPos.x;
                const dy = touch.clientY - editState.startPos.y;

                if (Math.sqrt(dx * dx + dy * dy) > 10) {
                    clearTimeout(editState.longPressTimer);
                }

                const parent = el.parentElement.getBoundingClientRect();
                let newLeft = touch.clientX - parent.left - editState.dragOffset.x;
                let newTop = touch.clientY - parent.top - editState.dragOffset.y;

                newLeft = Math.max(0, Math.min(newLeft, parent.width - el.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, parent.height - el.offsetHeight));

                el.style.left = newLeft + 'px';
                el.style.top = newTop + 'px';
                el.style.right = 'auto';
                el.style.bottom = 'auto';
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                clearTimeout(editState.longPressTimer);
                if (editState.dragging === el) {
                    const parent = el.parentElement.getBoundingClientRect();
                    const rect = el.getBoundingClientRect();
                    const cfg = controlSettings.buttons[btnId];

                    if (btnId === 'joystick-zone') {
                        cfg.pos.left = rect.left - parent.left;
                        cfg.pos.bottom = parent.bottom - rect.bottom;
                    } else {
                        cfg.pos.right = parent.right - rect.right;
                        cfg.pos.bottom = parent.bottom - rect.bottom;
                    }
                }
                editState.dragging = null;
            });
        }

        function showEditMenu(el, btnId) {
            editState.dragging = null;
            const menu = document.getElementById('edit-menu');
            const cfg = controlSettings.buttons[btnId];

            document.getElementById('edit-size').value = cfg.size;
            document.getElementById('edit-size-val').innerText = cfg.size + '%';
            document.getElementById('edit-hidden').checked = cfg.hidden;

            const rect = el.getBoundingClientRect();
            menu.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
            menu.style.top = Math.min(rect.bottom + 10, window.innerHeight - 280) + 'px';
            menu.style.display = 'block';
            menu.dataset.btnId = btnId;
        }

        document.getElementById('edit-size').addEventListener('input', (e) => {
            const size = parseInt(e.target.value);
            document.getElementById('edit-size-val').innerText = size + '%';
            const btnId = document.getElementById('edit-menu').dataset.btnId;
            if (btnId) {
                controlSettings.buttons[btnId].size = size;
                const el = document.getElementById('edit-' + btnId);
                if (el) {
                    const baseSize = btnId === 'joystick-zone' ? 150 : 80;
                    const newSize = baseSize * (size / 100);
                    el.style.width = newSize + 'px';
                    el.style.height = newSize + 'px';
                }
            }
        });

        document.getElementById('edit-hidden').addEventListener('change', (e) => {
            const btnId = document.getElementById('edit-menu').dataset.btnId;
            if (btnId) controlSettings.buttons[btnId].hidden = e.target.checked;
        });

        document.getElementById('btn-edit-keymap').addEventListener('click', () => {
            const btnId = document.getElementById('edit-menu').dataset.btnId;
            if (btnId) showKeymapMenu(btnId);
        });

        document.getElementById('btn-edit-menu-save').addEventListener('click', () => {
            document.getElementById('edit-menu').style.display = 'none';
        });

        let keySelectionMode = { active: false, callback: null };
        let currentKeymapHandler = null;
        let currentMousemapHandler = null;

        function clearKeymapListeners() {
            if (currentKeymapHandler) {
                document.removeEventListener('keydown', currentKeymapHandler);
                currentKeymapHandler = null;
            }
            if (currentMousemapHandler) {
                document.removeEventListener('mousedown', currentMousemapHandler);
                currentMousemapHandler = null;
            }
        }

        function showKeymapMenu(btnId) {
            document.getElementById('edit-menu').style.display = 'none';
            const screen = document.getElementById('keymap-screen');
            const grid = document.getElementById('keymap-grid');
            grid.innerHTML = '';

            clearKeymapListeners();

            const isJoystick = btnId === 'joystick-zone';

            if (isJoystick) {
                document.getElementById('keymap-hint').innerText = '点击方向后按下任意键';
                const dirs = [
                    { name: '前', key: 'forward' },
                    { name: '后', key: 'back' },
                    { name: '左', key: 'left' },
                    { name: '右', key: 'right' }
                ];
                dirs.forEach(d => {
                    const btn = document.createElement('button');
                    btn.className = 'menu-btn';
                    btn.style.cssText =
                        'border-color:rgba(255,255,255,0.6); color:white; width:120px; margin:5px; padding:10px; font-size:1rem;';
                    const currentKey = controlSettings.buttons[btnId].keys[d.key];
                    btn.innerText = `${d.name}: ${currentKey.toUpperCase()}`;
                    btn.onclick = () => {
                        document.getElementById('keymap-hint').innerText = `请按下"${d.name}"方向的键...`;
                        clearKeymapListeners();
                        currentKeymapHandler = (e) => {
                            e.preventDefault();
                            controlSettings.buttons[btnId].keys[d.key] = e.key;
                            btn.innerText = `${d.name}: ${e.key.toUpperCase()}`;
                            clearKeymapListeners();
                            document.getElementById('keymap-hint').innerText = '点击选择方向';
                        };
                        currentMousemapHandler = (e) => {
                            const key = e.button === 0 ? 'LMB' : e.button === 2 ? 'RMB' : e.button === 1 ?
                                'MMB' : null;
                            if (key) {
                                controlSettings.buttons[btnId].keys[d.key] = key;
                                btn.innerText = `${d.name}: ${key}`;
                                clearKeymapListeners();
                                document.getElementById('keymap-hint').innerText = '点击选择方向';
                            }
                        };
                        document.addEventListener('keydown', currentKeymapHandler);
                        document.addEventListener('mousedown', currentMousemapHandler);
                    };
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        btn.click();
                    }, { passive: false });
                    grid.appendChild(btn);
                });
            } else {
                document.getElementById('keymap-hint').innerText = '按下键盘或鼠标按键以设置...';
                const hint = document.createElement('div');
                hint.style.cssText =
                    'color:#4CAF50; font-size:1.2rem; margin-bottom:20px; text-align:center; width:100%;';
                hint.innerText = '按下任意键或点击鼠标...';
                grid.appendChild(hint);

                currentKeymapHandler = (e) => {
                    e.preventDefault();
                    controlSettings.buttons[btnId].key = e.key;
                    clearKeymapListeners();
                    screen.style.display = 'none';
                    showEditMenu(document.getElementById('edit-' + btnId), btnId);
                };
                currentMousemapHandler = (e) => {
                    const key = e.button === 0 ? 'LMB' : e.button === 2 ? 'RMB' : e.button === 1 ? 'MMB' : null;
                    if (key) {
                        controlSettings.buttons[btnId].key = key;
                        clearKeymapListeners();
                        screen.style.display = 'none';
                        showEditMenu(document.getElementById('edit-' + btnId), btnId);
                    }
                };
                document.addEventListener('keydown', currentKeymapHandler);
                document.addEventListener('mousedown', currentMousemapHandler);
            }

            screen.style.display = 'flex';
        }

        document.getElementById('btn-keymap-back').addEventListener('click', () => {
            clearKeymapListeners();
            document.getElementById('keymap-screen').style.display = 'none';
            const btnId = document.getElementById('edit-menu').dataset.btnId;
            if (btnId) showEditMenu(document.getElementById('edit-' + btnId), btnId);
        });

        document.getElementById('btn-control-save').addEventListener('click', () => {
            saveControlSettings();
            applyControlSettings();
            document.getElementById('control-edit-screen').style.display = 'none';
            document.getElementById('settings-screen').style.display = 'flex';
        });

        document.getElementById('btn-return-main').addEventListener('click', returnToMainMenu);

        document.getElementById('btn-reload-textures').addEventListener('click', () => {
            loadingComplete = false;
            minSplashTimePassed = true;
            document.getElementById('splash-screen').style.display = 'flex';
            document.getElementById('texture-progress-bar').style.width = '0%';
            textureLoadProgress = 0;
            textureLoadFailed = false;
            textureCache = {};
            isFallbackMode = false;
            preloadTextures().then((results) => {
                if (results === 'timeout' || (Array.isArray(results) && results.some(r => !r))) {
                    isFallbackMode = true;
                    TEXTURE_DEFS.forEach(def => {
                        if (!textureCache[def.name]) {
                            textureCache[def.name] = createFallbackTexture(def.fallback);
                        }
                    });
                    loadingComplete = true;
                    tryEnterMainMenu();
                } else {
                    loadingComplete = true;
                    tryEnterMainMenu();
                }
            });
        });

        document.getElementById('btn-fallback-mode').addEventListener('click', () => {
            isFallbackMode = true;
            TEXTURE_DEFS.forEach(def => {
                if (!textureCache[def.name]) {
                    textureCache[def.name] = createFallbackTexture(def.fallback);
                }
            });
            loadingComplete = true;
            tryEnterMainMenu();
        });

        document.getElementById('mode-fast').addEventListener('click', () => {
            fastMode = true;
            document.getElementById('mode-select-screen').style.display = 'none';
            document.getElementById('splash-screen').style.display = 'flex';
            minSplashTimePassed = true;
            loadingComplete = false;
            textureLoadProgress = 0;
            textureLoadFailed = false;
            textureCache = {};
            isFallbackMode = false;
            preloadTextures().then((results) => {
                if (results === 'timeout' || (Array.isArray(results) && results.some(r => !r))) {
                    isFallbackMode = true;
                    TEXTURE_DEFS.forEach(def => {
                        if (!textureCache[def.name]) {
                            textureCache[def.name] = createFallbackTexture(def.fallback);
                        }
                    });
                    loadingComplete = true;
                    tryEnterMainMenu();
                } else {
                    loadingComplete = true;
                    tryEnterMainMenu();
                }
            });
        });

        document.getElementById('mode-high').addEventListener('click', () => {
            fastMode = false;
            document.getElementById('mode-select-screen').style.display = 'none';
            document.getElementById('splash-screen').style.display = 'flex';
            minSplashTimePassed = true;
            loadingComplete = false;
            textureLoadProgress = 0;
            textureLoadFailed = false;
            textureCache = {};
            isFallbackMode = false;
            preloadTextures().then((results) => {
                if (results === 'timeout' || (Array.isArray(results) && results.some(r => !r))) {
                    isFallbackMode = true;
                    TEXTURE_DEFS.forEach(def => {
                        if (!textureCache[def.name]) {
                            textureCache[def.name] = createFallbackTexture(def.fallback);
                        }
                    });
                    loadingComplete = true;
                    tryEnterMainMenu();
                } else {
                    loadingComplete = true;
                    tryEnterMainMenu();
                }
            });
        });

        function loadWorlds() {
            const data = localStorage.getItem('blockworld_worlds_v2');
            worlds = data ? JSON.parse(data) : [];
        }
        loadWorlds();

        window.addEventListener('load', () => {
            const mainMenu = document.getElementById('main-menu');
            const splash = document.getElementById('splash-screen');
            const modeSelect = document.getElementById('mode-select-screen');
            mainMenu.style.display = 'none';
            splash.style.display = 'none';
            modeSelect.style.display = 'flex';
        });

        function initMenuTouch() {
            const buttons = document.querySelectorAll('.menu-btn, #btn-return-main, .popup-btn');
            buttons.forEach(btn => {
                if (btn._touchInited) return;
                btn._touchInited = true;
                btn.addEventListener('touchstart', (e) => { e.preventDefault();
                    e.stopPropagation();
                    btn.click(); }, { passive: false });
            });
        }
        initMenuTouch();
        const observer = new MutationObserver(() => { initMenuTouch(); });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>
</body>
</html>
